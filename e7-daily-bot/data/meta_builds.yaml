# Meta builds library. Each entry tells the scorer what a hero wants.
#
# Schema per build:
#   name:               canonical hero name as it appears in Fribbels (Eng).
#   role_label:         free text — your reminder of what they do.
#   sets_priority:      list of preferred sets, best first. Use Fribbels keys
#                       (SpeedSet, ImmunitySet, RageSet, HitSet, LifestealSet,
#                        ResistSet, ProtectionSet, CounterSet, DestructionSet,
#                        ReverseSet, ResistSet, RevengeSet, InjurySet, ...)
#   main_necklace:      list of acceptable main stats (canonical keys). Empty = any
#   main_ring:          same.
#   main_boots:         same. (Speed almost always; sometimes Atk%/HP%.)
#   substats_priority:  ordered list. Earlier = more weight.
#                       canonical keys: speed, attack_pct, crit_chance, crit_damage,
#                       health_pct, defense_pct, effectiveness, effect_resist,
#                       attack, health, defense
#   main_stat_strict:   true to harshly punish wrong main on N/R/B.
#   tier:               1..5 (1 = priority build, 5 = niche).
#
# Add as many heroes as you want. Use lowercased keys for stable sorting.

