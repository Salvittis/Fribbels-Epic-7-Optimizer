# Epic Seven Daily Bot — configuration
# Adjust to match your setup. The 'daily' list controls the order in which
# routines run when you do `python run.py daily`.

driver:
  # 'mouse' for PC Client (Stove launcher) — recommended for native PC players.
  # 'adb' for Android emulator (BlueStacks, LDPlayer, etc).
  kind: mouse

  # === MOUSE driver settings (PC Client) ===
  # Hover over the game's taskbar icon to see the exact title. Must match exactly.
  window_title: "Epic Seven"
  # The window will be resized to width x height for stable coordinates.
  # 1280x720 is a comfortable default; PNG templates must be captured at this size.
  width: 1280
  height: 720
  auto_resize: true
  auto_focus: true
  move_to_origin: true   # snaps the window to (0,0) for predictable absolute coords

  # === ADB driver settings (uncomment if using emulator) ===
  # serial: 127.0.0.1:5555    # BlueStacks/LDPlayer default; null = auto-pick

  # === Common ===
  tap_jitter_px: 6   # +/- N px noise per tap (anti-detection / human-like)
  tap_delay: 0.25    # seconds after each tap

assets_dir: assets
match_threshold: 0.85
history_dir: logs

# Routines run in this order when you call `python run.py daily`.
# Comment lines you don't want or reorder freely.
daily:
  - login         # mail + login bonus
  - sanctuary     # gold tree + training camp + forest
  - guild         # check-in + donation
  - hunt          # auto-hunt with substat filter
  - worldboss     # one shot per day
  - shop          # secret shop refresh (covenant + mystic bookmarks)
  - labyrinth_shop  # buy bookmarks at labyrinth's forest blessing shop

routines:
  hunt:
    target: wyvern        # wyvern | banshee | golem | azimanak
    difficulty: 13
    # Stop the hunt early when a dropped gear matches one of these filters.
    # Filters are OR'd (any match stops the bot).
    stop_on_drop:
      - gear: boots
        main_stat: speed
        substats_any: [speed, crit_chance, crit_damage]
      - gear: ring
        main_stat: attack_pct
        substats_any: [crit_chance, crit_damage, speed]
    max_battles: 60       # safety cap

  shop:
    items: [covenant, mystic]
    budget: 90            # skystones; null = run until ESC

  labyrinth_shop:
    # Items to buy in the Forest Blessing Shop inside the labyrinth lobby.
    # Each entry is a template name in assets/labyrinth_shop/
    items: [covenant, friendship]
